<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Echoes of the Gate (Baseline)</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-title">Echoes of the Gate</div>
        <div class="brand-sub">Baseline v0.1 — deterministic exploration core</div>
      </div>

      <div class="topbar-right">
        <div id="smokeStatus" class="badge" data-testid="smoke-status" aria-live="polite">SMOKE: OFF</div>
        <div class="seed" id="seedDisplay"></div>
      </div>
    </header>

    <main class="layout">
      <section class="map-panel">
        <div class="panel-title">GALAXY MAP</div>
        <div id="map" class="map" data-testid="hex-map"></div>
        <div class="map-hint">Click a fogged hex to reveal it.</div>
      </section>

      <aside class="right-panel">
        <div class="panel-title">CARD</div>
        <div id="cardPanel" class="card" data-testid="card-panel">
          <div class="card-placeholder">
            Explore a hex to draw a card.
          </div>
        </div>

        <div class="panel-title">DICE (baseline)</div>
        <div class="dice">
          <button id="rollDiceBtn" class="btn" type="button">Roll 2d6</button>
          <div class="dice-row">
            <div class="die" data-testid="die-a" id="dieA">-</div>
            <div class="die" data-testid="die-b" id="dieB">-</div>
          </div>
          <div class="dice-note">Dice/actions are present but not yet used for movement in this baseline.</div>
        </div>
      </aside>

      <section class="bottom-panel">
        <div class="panel-title">GAME LOG</div>
        <div id="log" class="log" data-testid="game-log"></div>
      </section>
    </main>

    <!-- readiness marker -->
    <div id="appReady" data-testid="app-ready" class="hidden"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
