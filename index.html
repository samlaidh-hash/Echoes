<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%23132a4a' width='32' height='32'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='%237aa2ff'>⛨</text></svg>" />
  <title>Echoes of the Gate (Baseline)</title>
  <style>
    /* Critical CSS: prevents layout-before-styles warning */
    body{margin:0;min-height:100vh;background:#0b0f17}
    #loadingOverlay{position:fixed;inset:0;z-index:200;background:rgba(11,15,23,.95);display:flex;align-items:center;justify-content:center}
    .loading-content{text-align:center}
    .loading-spinner{width:48px;height:48px;margin:0 auto 16px;border:3px solid #24324d;border-top-color:#7aa2ff;border-radius:50%;animation:lspin .9s linear infinite}
    @keyframes lspin{to{transform:rotate(360deg)}}
    .loading-text{color:#9fb0cc;font-size:14px}
    .hidden{display:none!important}
  </style>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="loadingOverlay" class="loading-overlay" data-testid="loading-overlay">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading Echoes...</div>
    </div>
  </div>
  <div id="errorOverlay" class="error-overlay hidden" data-testid="error-overlay">
    <div class="error-content">
      <div class="error-title">Failed to Load</div>
      <div id="errorMessage" class="error-message"></div>
      <button id="errorRetryBtn" class="btn" type="button">Retry</button>
    </div>
  </div>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-title">Echoes of the Gate</div>
        <div class="brand-sub">v0.2 — exploration and area control</div>
      </div>

      <div id="tutorialSlot" class="tutorial-slot"></div>

      <div class="topbar-right">
        <div id="smokeStatus" class="badge" data-testid="smoke-status" aria-live="polite">SMOKE: OFF</div>
        <div class="seed" id="seedDisplay"></div>
      </div>
    </header>

    <div id="hud" class="hud" data-testid="hud"></div>
    <main class="layout">
      <section class="map-panel">
        <div class="map-panel-header">
          <span class="panel-title">GALAXY MAP</span>
          <button id="legendBtn" class="legend-btn" type="button" data-testid="legend-btn">Legend</button>
        </div>
        <div id="legendTooltip" class="legend-tooltip hidden"></div>
        <div id="map" class="map" data-testid="hex-map"></div>
        <div class="map-hint">Recon or moving a fleet into a hex reveals it. Only a ship entering the hex can choose the option and flip the card. Hover over a hex to see its card.</div>
      </section>

      <aside class="right-panel">
        <div class="panel-title">CARD</div>
        <div id="cardPanel" class="card" data-testid="card-panel">
          <div class="card-placeholder">
            Explore a hex to draw a card.
          </div>
        </div>

        <div class="panel-title">LOG</div>
        <div id="log" class="log" data-testid="game-log"></div>
      </aside>

      <section id="actionPanel" class="action-panel" data-testid="action-panel"></section>
    </main>

    <!-- readiness marker -->
    <div id="appReady" data-testid="app-ready" class="hidden"></div>
    <div id="combatModal" class="combat-modal hidden" data-testid="combat-modal"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
